[pytest]
testpaths = tests
# live_tests/ is deliberately not listed: those tests need the real Nexus VM
# and are run by hand - see live_tests/README.md.
# Every async test in this repo is explicitly marked, so strict mode is the
# honest setting: an unmarked async test should fail loudly rather than be
# silently skipped. That silent skip is exactly how 120 tests went unverified.
asyncio_mode = strict
