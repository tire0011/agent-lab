name: issue61-fix-mailbox-test

on:
  push:
    branches: [issue-61-nexus-chat]
    paths: [.github/workflows/issue61-fix-mailbox-test.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-61-nexus-chat
          fetch-depth: 0
      - name: Make mailbox removal tolerate untracked absent files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modules/mailbox.py')
          text = p.read_text(encoding='utf-8')
          old = '            _git(["rm", "--", str(rel)], repo_path)'
          new = '            _git(["rm", "--ignore-unmatch", "--", str(rel)], repo_path)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one git rm staging call, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/issue61-fix-mailbox-test.yml').unlink()
          PY
      - name: Commit mailbox robustness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/mailbox.py .github/workflows/issue61-fix-mailbox-test.yml
          git commit -m "Tolerate absent untracked mailbox files"
          git push origin HEAD:issue-61-nexus-chat
