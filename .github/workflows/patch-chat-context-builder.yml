name: One-shot chat context builder patch
on:
  push:
    branches: [fix/chat-context-builder]
    paths: [.github/workflows/patch-chat-context-builder.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-context-builder
      - name: Apply compact chat context patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('modules/nexus_chat_service.py')
          text = path.read_text()
          start = text.index('    def _prompt(self, session: Any, current_input: str, history: list[dict[str, Any]], observations: list[dict[str, Any]]) -> str:\n', text.index('class _ChatOrchestrator'))
          end = text.index('    async def _execute_tool', start)
          new = r'''    def _compact_capabilities(self) -> list[dict[str, Any]]:
              compact: list[dict[str, Any]] = []
              for item in self._capabilities():
                  entry = {"name": item.get("name"), "description": item.get("description", "")}
                  if item.get("name") == "operation":
                      entry["operations"] = [
                          {
                              "name": op.get("operation") or op.get("name"),
                              "description": op.get("description", ""),
                              "arguments": [arg.get("name") for arg in op.get("arguments", []) if isinstance(arg, dict)],
                          }
                          for op in item.get("operations", [])
                      ]
                  elif "providers" in item:
                      entry["providers"] = [provider.get("provider") for provider in item.get("providers", [])]
                  elif "arguments" in item:
                      entry["arguments"] = item.get("arguments")
                  compact.append(entry)
              return compact

          @staticmethod
          def _compact_history(history: list[dict[str, Any]]) -> list[dict[str, Any]]:
              compact: list[dict[str, Any]] = []
              chars = 0
              for event in reversed(history[-10:]):
                  if event.get("role") == "tool":
                      continue
                  content = str(event.get("content", "")).strip()
                  if not content:
                      continue
                  content = content[:700]
                  if chars + len(content) > 2500 and compact:
                      break
                  compact.append({"role": event.get("role", ""), "kind": event.get("kind", ""), "content": content})
                  chars += len(content)
                  if len(compact) >= 6:
                      break
              compact.reverse()
              return compact

          def _prompt(self, session: Any, current_input: str, history: list[dict[str, Any]], observations: list[dict[str, Any]]) -> str:
              import json

              allowed_actions = [ACTION_ANSWER, ACTION_CLARIFICATION, ACTION_MISSING_CAPABILITY]
              policy = "Discussion only: use read-only tools when needed; do not mutate."
              if self.allow_mutation:
                  allowed_actions = [ACTION_NEW_EXPERIMENT, ACTION_RESUME_EXPERIMENT, ACTION_ANSWER, ACTION_CLARIFICATION, ACTION_MISSING_CAPABILITY]
                  policy = "Execution explicitly requested: mutating command/experiment actions are allowed when useful."
              return "\n".join([
                  "You are Nexus, the persistent local chat controller. Be concise and solve the current turn with the cheapest capable path.",
                  "",
                  "CURRENT INPUT:", current_input,
                  "",
                  "RECENT CHAT:", json.dumps(self._compact_history(history), separators=(",", ":")),
                  "",
                  "CAPABILITIES:", json.dumps(self._compact_capabilities(), separators=(",", ":")),
                  "",
                  "OBSERVATIONS:", json.dumps(observations, separators=(",", ":")),
                  "",
                  "POLICY: " + policy,
                  "Use memory/inspection only when it materially helps. Commands are tools, never final actions. After any tool result, decide again. Never invent tool results or IDs.",
                  'Tool JSON: {"type":"tool","tool":"operation|memory_search|delegate|command",...}',
                  'Final JSON: {"type":"action","action":"' + "|".join(allowed_actions) + '","experiment_id":null,"message":"...","reason":"..."}',
                  "Return JSON only.",
              ])

          '''
          path.write_text(text[:start] + new + text[end:])

          test = Path('tests/test_nexus_chat_context.py')
          test.write_text(r'''import unittest
          from types import SimpleNamespace
          from unittest.mock import MagicMock

          from modules.nexus_chat_service import _ChatOrchestrator


          class ChatContextTests(unittest.TestCase):
              def _orchestrator(self, allow_mutation=False):
                  registry = MagicMock()
                  registry.catalog.return_value = []
                  registry.db_path = ':memory:'
                  registry.repo_root = '/tmp'
                  return _ChatOrchestrator(
                      operations_registry=registry,
                      experiment_service=MagicMock(),
                      allow_mutation=allow_mutation,
                      llama_client=MagicMock(),
                  )

              def test_chat_prompt_is_compact_and_keeps_recent_context(self):
                  orchestrator = self._orchestrator(False)
                  try:
                      history = [{"role":"user","kind":"input","content":f"old-{i}-" + ("x" * 500)} for i in range(12)]
                      prompt = orchestrator._prompt(SimpleNamespace(), "Hallo Nexus", history, [])
                      self.assertLess(len(prompt), 5000)
                      self.assertIn("Hallo Nexus", prompt)
                      self.assertIn("old-11-", prompt)
                      self.assertNotIn("old-0-", prompt)
                      self.assertIn("Discussion only", prompt)
                  finally:
                      orchestrator.close()

              def test_execution_prompt_keeps_mutating_actions(self):
                  orchestrator = self._orchestrator(True)
                  try:
                      prompt = orchestrator._prompt(SimpleNamespace(), "Mach das", [], [])
                      self.assertIn("new_experiment", prompt)
                      self.assertIn("resume_experiment", prompt)
                      self.assertIn("command", prompt)
                      self.assertIn("Execution explicitly requested", prompt)
                  finally:
                      orchestrator.close()


          if __name__ == '__main__':
              unittest.main()
          '''.replace('\n          ', '\n'))
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/nexus_chat_service.py tests/test_nexus_chat_context.py
          git commit -m "Compact Nexus chat context for all chat clients"
          git rm .github/workflows/patch-chat-context-builder.yml
          git commit -m "Remove temporary chat context patch workflow"
          git push origin HEAD:fix/chat-context-builder