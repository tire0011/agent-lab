name: Apply issue 190 policy cleanup

on:
  push:
    branches:
      - fix/190-remove-git-keyword-policy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/190-remove-git-keyword-policy
      - name: Remove obsolete Git keyword blocking
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          policy_path = Path('modules/experiment_service/policy.py')
          policy = policy_path.read_text()

          old = '    "commit", "push", "merge",\n'
          assert old in policy
          policy = policy.replace(old, '', 1)

          policy, n = re.subn(
              r'\n# The three git-action keywords.*?_GIT_ACTION_KEYWORDS: frozenset\[str\] = frozenset\(\{"commit", "push", "merge"\}\)\n',
              '\n# Normal branch-scoped Git operations are allowed for experiments.\n# Main/merge/deployment governance is enforced by the lifecycle layer.\n',
              policy,
              count=1,
              flags=re.S,
          )
          assert n == 1

          policy, n = re.subn(
              r'\n# Git-action detection for the goal-level policy check \(_check_goal_policy\).*?_GIT_ACTION_REGEXES: tuple\[re\.Pattern\[str\], \.\.\.\] = \(.*?\n\)\n\n# Words whose',
              '\n# Git commit/push/merge are intentionally not filtered here. They are normal\n# experiment-branch workflow operations.\n\n# Words whose',
              policy,
              count=1,
              flags=re.S,
          )
          assert n == 1

          new_goal = '''def _check_goal_policy(goal: str) -> str | None:
              """Apply non-Git safety checks directly to the raw goal text.

              Normal branch-scoped Git operations are intentionally allowed here.
              Main-branch, merge, and deployment governance belongs to the lifecycle
              layer, not keyword matching in user goals.
              """
              haystack = (goal or "").lower()
              for keyword in _REJECT_KEYWORDS:
                  if keyword in haystack:
                      return f"goal mentions disallowed keyword: {keyword!r}"
              for regex in _INFRA_ACTION_REGEXES:
                  for match in regex.finditer(haystack):
                      preceding = haystack[max(0, match.start() - 200):match.start()]
                      if _infra_action_match_is_false_positive(match.group(0), preceding):
                          continue
                      return (
                          "goal describes an actual infrastructure/deployment action "
                          f"with external effect: {match.group(0)!r}"
                      )
              for regex in _SECRET_ACTION_REGEXES:
                  for match in regex.finditer(haystack):
                      preceding = haystack[max(0, match.start() - 200):match.start()]
                      following = haystack[match.end():min(len(haystack), match.end() + 120)]
                      if _secret_action_match_is_false_positive(match.group(0), preceding, following):
                          continue
                      return (
                          "goal describes an actual secret/credential action: "
                          f"{match.group(0)!r}"
                      )
              return None
          '''
          new_goal = '\n'.join(line[12:] if line.startswith('            ') else line for line in new_goal.splitlines()) + '\n'
          policy, n = re.subn(
              r'def _check_goal_policy\(goal: str\) -> str \| None:.*?\n\n# ---------------------------------------------------------------------------\n# Policy rule classification',
              new_goal + '\n# ---------------------------------------------------------------------------\n# Policy rule classification',
              policy,
              count=1,
              flags=re.S,
          )
          assert n == 1
          policy = policy.replace(
              '    ("goal requests a disallowed git action", "disallowed_keyword"),\n',
              '',
          )
          policy_path.write_text(policy)

          tests_path = Path('tests/test_experiment_service.py')
          tests = tests_path.read_text()

          def replace_method(name, replacement):
              global tests
              pattern = rf'    def {name}\(self\):.*?(?=\n    def |\n\nclass |\n\n@unittest|\Z)'
              tests, count = re.subn(pattern, replacement.rstrip(), tests, count=1, flags=re.S)
              assert count == 1, name

          replace_method(
              'test_policy_violation_persists_matched_policy_rule',
              '''    def test_policy_violation_persists_matched_policy_rule(self):
                  # Non-Git safety policy still persists a stable rule.
                  experiment = self.service.create_experiment(
                      goal="Run pip install requests before implementing the feature."
                  )
                  result = self.service.run_experiment(experiment.id)
                  self.assertEqual(result.status, STATUS_REJECTED)
                  self.assertEqual(result.policy_rule, "disallowed_keyword")
                  self.assertIsNotNone(result.error)
                  self.implementation_worker.run.assert_not_called()''',
          )

          replace_method(
              'test_goal_mentioning_commit_is_rejected',
              '''    def test_goal_git_workflow_is_allowed(self):
                  experiment = self.service.create_experiment(
                      goal=(
                          "Implement the feature on a dedicated branch; commit the changes, "
                          "push the branch, and report the commit SHA and CI result."
                      )
                  )
                  result = self.service.run_experiment(experiment.id)
                  self.assertNotEqual(result.status, STATUS_REJECTED)
                  self.implementation_worker.run.assert_called_once()''',
          )

          replace_method(
              'test_rejected_experiment_never_creates_worktree',
              '''    def test_rejected_experiment_never_creates_worktree(self):
                  experiment = self.service.create_experiment(
                      goal="Run rm -rf on generated files before implementing the change."
                  )
                  result = self.service.run_experiment(experiment.id)
                  self.assertEqual(result.status, STATUS_REJECTED)
                  self.assertIsNone(result.worktree_path)
                  self.assertFalse(self.worktrees_root.exists() and any(self.worktrees_root.iterdir()))''',
          )

          replace_method(
              'test_push_and_merge_are_still_rejected',
              '''    def test_branch_git_workflow_is_accepted(self):
                  data = json.loads(VALID_PLAN_JSON)
                  data["expected_changes"] = (
                      "Implement the change, commit it, push the experiment branch, and prepare a pull request."
                  )
                  plan = parse_plan(json.dumps(data))
                  self.assertIsNotNone(plan)
                  self.assertIsNone(plan_violates_policy(plan, json.dumps(data)))''',
          )

          direct_replacements = {
              'test_git_merge_command_is_blocked': 'test_git_merge_command_is_allowed',
              'test_commit_changes_is_blocked': 'test_commit_changes_is_allowed',
              'test_merge_pull_request_is_blocked': 'test_merge_pull_request_is_allowed',
              'test_commit_result_is_blocked': 'test_commit_result_is_allowed',
          }
          for old_name, new_name in direct_replacements.items():
              tests = tests.replace(f'def {old_name}(self):', f'def {new_name}(self):')

          for phrase in (
              'run git merge to integrate changes',
              'commit the changes to the repo',
              'merge the pull request after review',
              'implement and commit the result',
          ):
              old_assert = f'self.assertIsNotNone(_check_goal_policy("{phrase}"))'
              if old_assert in tests:
                  tests = tests.replace(old_assert, f'self.assertIsNone(_check_goal_policy("{phrase}"))')

          regression = '''

class GitWorkflowPolicyRegressionTest(unittest.TestCase):
    def test_issue_186_reporting_phrase_is_allowed(self):
        goal = (
            "Implement issue #186 on a dedicated branch. Final result must report "
            "commit SHA(s), tests run/results, CI result, and explicitly confirm not merged."
        )
        self.assertIsNone(_check_goal_policy(goal))

    def test_push_branch_workflow_is_allowed(self):
        self.assertIsNone(
            _check_goal_policy(
                "Commit the changes, push the experiment branch, and open a pull request."
            )
        )
'''
          if 'class GitWorkflowPolicyRegressionTest' not in tests:
              tests += regression
          tests_path.write_text(tests)
          PY

          python -m py_compile modules/experiment_service/policy.py tests/test_experiment_service.py
          git diff --check
      - name: Commit policy cleanup
        shell: bash
        run: |
          rm .github/workflows/fix-190-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/experiment_service/policy.py tests/test_experiment_service.py .github/workflows/fix-190-apply.yml
          git commit -m "fix: allow branch git workflow in experiments"
          git push origin HEAD:fix/190-remove-git-keyword-policy
