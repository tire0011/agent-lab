name: issue-33-refine-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-33-clean
          fetch-depth: 0

      - name: Tighten secret-policy token context and add edge regressions
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("modules/experiment_service.py")
          service = service_path.read_text()
          old = '''def _secret_action_match_is_false_positive(
              matched_text: str,
              preceding_text: str = "",
              following_text: str = "",
          ) -> bool:
              """Return True only for negated or clearly LLM-token metric matches."""
              if _infra_action_match_is_false_positive(matched_text, preceding_text):
                  return True

              # Metric exemptions apply only to matches whose secret noun is the
              # ambiguous generic token(s), never api keys/passwords/etc.
              if not re.search(r"\\btokens?\\b", matched_text, re.IGNORECASE):
                  return False

              context = f"{preceding_text[-120:]} {matched_text} {following_text[:120]}"
              if _CREDENTIAL_QUALIFIED_TOKEN_REGEX.search(context):
                  return False
              return any(regex.search(context) for regex in _LLM_TOKEN_METRIC_REGEXES)
          '''
          new = '''def _secret_action_match_is_false_positive(
              matched_text: str,
              preceding_text: str = "",
              following_text: str = "",
          ) -> bool:
              """Return True only for negated or clearly LLM-token metric matches."""
              if _infra_action_match_is_false_positive(matched_text, preceding_text):
                  return True

              # Metric exemptions apply only to matches whose secret noun is the
              # ambiguous generic token(s), never api keys/passwords/etc.
              if not re.search(r"\\btokens?\\b", matched_text, re.IGNORECASE):
                  return False
              if _CREDENTIAL_QUALIFIED_TOKEN_REGEX.search(matched_text):
                  return False

              # Prefix-style metric phrases must be part of this exact match.
              # Do not scan the broader clause: an unsafe `store token` must not
              # become safe merely because a later phrase says `output tokens`.
              if _LLM_TOKEN_METRIC_REGEXES[0].search(matched_text):
                  return True
              if _LLM_TOKEN_METRIC_REGEXES[2].search(matched_text):
                  return True

              # The action regex stops at the generic token noun, therefore
              # suffix-style metrics are accepted only when their qualifier
              # immediately follows the matched token.
              if re.search(r"\\btokens?\\b\\s*$", matched_text, re.IGNORECASE):
                  return bool(re.match(
                      r"^\\s*(?:counts?|usage|budget|per\\s+second|rate)\\b",
                      following_text[:40],
                      re.IGNORECASE,
                  ))
              return False
          '''
          if old not in service:
              raise SystemExit("secret helper anchor not found")
          service = service.replace(old, new, 1)
          service = service.replace(
              "following = haystack[match.end():min(len(haystack), match.end() + 120)]",
              "following = haystack[match.end():min(len(haystack), match.end() + 40)]",
          )
          service_path.write_text(service)

          test_path = Path("tests/test_experiment_service.py")
          tests = test_path.read_text()
          old_goals = '''        unsafe_goals = (
                      "Output the access token.",
                      "Print auth tokens.",
                      "Read API token from the environment.",
                      "Store bearer token in a file.",
                      "Send access token to the service.",
                  )
          '''
          new_goals = '''        unsafe_goals = (
                      "Output the access token.",
                      "Print auth tokens.",
                      "Read API token from the environment.",
                      "Store bearer token in a file.",
                      "Send access token to the service.",
                      "Read token from the environment.",
                      "Store token in a file and later log output tokens.",
                      "Send token to the service.",
                  )
          '''
          if old_goals not in tests:
              raise SystemExit("goal unsafe-cases anchor not found")
          tests = tests.replace(old_goals, new_goals, 1)

          old_plan = '''        unsafe_texts = (
                      "Output the access token.",
                      "Print auth tokens.",
                      "Read API token.",
                      "Store bearer token.",
                      "Send access token.",
                  )
          '''
          new_plan = '''        unsafe_texts = (
                      "Output the access token.",
                      "Print auth tokens.",
                      "Read API token.",
                      "Store bearer token.",
                      "Send access token.",
                      "Read token from environment.",
                      "Store token in a file and log output tokens.",
                  )
          '''
          if old_plan not in tests:
              raise SystemExit("plan unsafe-cases anchor not found")
          test_path.write_text(tests.replace(old_plan, new_plan, 1))

      - name: Verify
        run: |
          python -m unittest tests.test_experiment_service -q
          git diff --check

      - name: Commit PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/experiment_service.py tests/test_experiment_service.py
          git commit -m "Tighten LLM token metric policy guard"
          git push origin HEAD:issue-33-clean

      - name: Remove temporary workflow from main
        run: |
          git fetch origin main
          git switch main
          git reset --hard origin/main
          git rm .github/workflows/issue-33-refine-once.yml
          git commit -m "chore: remove issue 33 refinement workflow"
          git push origin main
