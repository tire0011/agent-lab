name: Repair chat context builder
on:
  push:
    branches: [fix/chat-context-builder]
    paths: [.github/workflows/fix-chat-context-indent.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-context-builder
      - name: Repair block and verify focused tests
        shell: python
        run: |
          from pathlib import Path
          import base64, py_compile, subprocess
          encoded = ''
          replacement = base64.b64decode(encoded).decode()
          path = Path('modules/nexus_chat_service.py')
          text = path.read_text()
          start = text.index('    def _compact_capabilities')
          end = text.index('    async def _execute_tool', start)
          path.write_text(text[:start] + replacement + text[end:])
          py_compile.compile(str(path), doraise=True)
          subprocess.run(['python','-m','unittest','tests.test_nexus_chat_context','tests.test_nexus_chat_service'], check=True)
      - name: Commit repair and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/nexus_chat_service.py tests/test_nexus_chat_context.py
          git commit -m "Fix compact chat context implementation"
          git rm .github/workflows/fix-chat-context-indent.yml
          git commit -m "Remove temporary chat context repair workflow"
          git push origin HEAD:fix/chat-context-builder
