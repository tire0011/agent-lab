name: Expand issue 190 policy cleanup

on:
  push:
    branches:
      - fix/190-remove-git-keyword-policy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/190-remove-git-keyword-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply expanded policy cleanup
        run: python scripts/expand_190_policy.py
      - name: Validate
        run: |
          python -m py_compile modules/experiment_service/policy.py tests/test_experiment_service.py
          git diff --check
      - name: Commit cleanup
        run: |
          rm .github/workflows/expand-190-one-shot.yml scripts/expand_190_policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/experiment_service/policy.py tests/test_experiment_service.py .github/workflows/expand-190-one-shot.yml scripts/expand_190_policy.py
          git commit -m "fix: allow Nexus package and infrastructure maintenance"
          git push origin HEAD:fix/190-remove-git-keyword-policy
