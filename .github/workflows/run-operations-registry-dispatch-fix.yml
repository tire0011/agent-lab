name: Run operations registry dispatch fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-operations-registry-dispatch-fix.yml

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operations-registry-handler-dispatch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply patch
        run: python scripts/apply_operations_registry_dispatch_fix.py
      - name: Focused tests
        env:
          AGENT_API_KEY: test-key
          AGENT_DB_PATH: ${{ runner.temp }}/nexus-test/agent.db
        run: python -m unittest tests.test_operations_registry tests.test_operation_chain_service -q
      - name: Full tests
        env:
          AGENT_API_KEY: test-key
          AGENT_DB_PATH: ${{ runner.temp }}/nexus-test/agent.db
        run: python scripts/run_tests_ci.py
      - name: Commit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply_operations_registry_dispatch_fix.py
          git add modules/operations_registry.py tests/test_operations_registry.py
          git add -u scripts/apply_operations_registry_dispatch_fix.py
          git commit -m "Remove operations registry allowlist gate"
          git push origin HEAD:fix/operations-registry-handler-dispatch
