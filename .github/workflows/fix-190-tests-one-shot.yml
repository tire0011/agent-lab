name: Fix issue 190 policy tests

on:
  push:
    branches:
      - fix/190-remove-git-keyword-policy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/190-remove-git-keyword-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply test migration
        run: python scripts/fix_190_policy_tests.py
      - name: Validate syntax
        run: |
          python -m py_compile tests/test_experiment_service.py
          git diff --check
      - name: Commit migrated tests
        run: |
          rm scripts/fix_190_policy_tests.py .github/workflows/fix-190-tests-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_experiment_service.py scripts/fix_190_policy_tests.py .github/workflows/fix-190-tests-one-shot.yml
          git commit -m "test: align experiment policy tests with issue 190"
          git push origin HEAD:fix/190-remove-git-keyword-policy
