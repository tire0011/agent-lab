name: Run mailbox recovery fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-mailbox-recovery-fix.yml

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mailbox-rejected-chain-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Apply focused patches
        run: |
          python scripts/apply_mailbox_recovery_fix.py
          python scripts/apply_mailbox_recovery_compat_fix.py
      - name: Focused regression tests
        env:
          AGENT_API_KEY: test-key
          AGENT_DB_PATH: ${{ runner.temp }}/nexus-test/agent.db
        run: python -m unittest tests.test_mailbox_poll_runner tests.test_mailbox_operation_chain tests.test_mailbox_webhook_sync_failure -q
      - name: Full project tests
        env:
          AGENT_API_KEY: test-key
          AGENT_DB_PATH: ${{ runner.temp }}/nexus-test/agent.db
        run: python scripts/run_tests_ci.py
      - name: Commit fixed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_mailbox_recovery_fix.py scripts/apply_mailbox_recovery_compat_fix.py .github/workflows/apply-mailbox-recovery-fix.yml full-suite-failure.log
          git add modules/operation_chain_service.py modules/mailbox_poll_runner.py tests/test_mailbox_poll_runner.py tests/test_mailbox_operation_chain.py
          git add -u scripts .github/workflows full-suite-failure.log || true
          git commit -m "Fix rejected chain mailbox recovery"
          git push origin HEAD:fix/mailbox-rejected-chain-recovery
