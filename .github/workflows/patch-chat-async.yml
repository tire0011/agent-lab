name: patch-chat-async
on:
  push:
    branches: [fix/issue-61-chat-async]
    paths: [.github/workflows/patch-chat-async.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-61-chat-async
      - name: Patch API models browser and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('models.py')
          s = p.read_text()
          old = '''class ChatResponse(BaseModel):
              reply: str
              intent: str
              session_id: str
              action: str
              experiment_id: str | None = None
              status: str
          '''.replace('          ', '')
          new = '''class ChatResponse(BaseModel):
              reply: str
              intent: str
              session_id: str
              action: str
              experiment_id: str | None = None
              status: str


          class ChatJobResponse(BaseModel):
              job_id: str
              status: str
              reply: str | None = None
              intent: str | None = None
              session_id: str | None = None
              action: str | None = None
              experiment_id: str | None = None
              error: str | None = None
          '''.replace('          ', '')
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('api.py')
          s = p.read_text()
          s = s.replace('from modules.nexus_chat_service import NexusChatService\n', 'from modules.nexus_chat_service import NexusChatService\nfrom modules.nexus_chat_jobs import NexusChatJobService, STATUS_FAILED, STATUS_SUCCEEDED\n', 1)
          s = s.replace('    ChatRequest,\n    ChatResponse,\n', '    ChatRequest,\n    ChatResponse,\n    ChatJobResponse,\n', 1)
          anchor = '''@lru_cache(maxsize=1)
          def get_nexus_chat_service() -> NexusChatService:
              return NexusChatService(
                  operations_registry=get_operations_service(),
                  experiment_service=get_experiment_service(),
              )
          '''.replace('          ', '')
          replacement = anchor + '''

          @lru_cache(maxsize=1)
          def get_nexus_chat_job_service() -> NexusChatJobService:
              return NexusChatJobService(get_nexus_chat_service())
          '''.replace('          ', '')
          assert anchor in s
          s = s.replace(anchor, replacement, 1)
          start = s.index('@app.post("/chat", response_model=ChatResponse)')
          end = s.index('\n\n# ---------------------------------------------------------------------------\n# Codex task endpoints', start)
          routes = '''@app.post("/chat", response_model=ChatJobResponse, status_code=202)
          def chat(
              request: ChatRequest,
              x_api_key: str | None = Header(default=None),
              service: NexusChatJobService = Depends(get_nexus_chat_job_service),
          ) -> ChatJobResponse:
              authorize(x_api_key)
              try:
                  job = service.submit(request.message, session_id=request.session_id)
              except ValueError as exc:
                  raise HTTPException(status_code=400, detail=str(exc)) from exc
              return ChatJobResponse(job_id=job.id, status=job.status, session_id=job.session_id)


          @app.get("/chat/jobs/{job_id}", response_model=ChatJobResponse)
          def get_chat_job(
              job_id: str,
              x_api_key: str | None = Header(default=None),
              service: NexusChatJobService = Depends(get_nexus_chat_job_service),
          ) -> ChatJobResponse:
              authorize(x_api_key)
              job = service.get(job_id)
              if job is None:
                  raise HTTPException(status_code=404, detail="chat job not found")
              if job.status == STATUS_SUCCEEDED and job.result is not None:
                  result = job.result
                  return ChatJobResponse(
                      job_id=job.id,
                      status=job.status,
                      reply=result.reply,
                      intent=result.action,
                      session_id=result.session_id,
                      action=result.action,
                      experiment_id=result.experiment_id,
                  )
              return ChatJobResponse(
                  job_id=job.id,
                  status=job.status,
                  session_id=job.session_id,
                  error=job.error if job.status == STATUS_FAILED else None,
              )
          '''.replace('          ', '')
          s = s[:start] + routes.rstrip() + s[end:]
          p.write_text(s)

          p = Path('static/app.js')
          s = p.read_text()
          start = s.index('async function sendMessage(event) {')
          end = s.index('\n\nasync function submitIdea(event)', start)
          fn = '''async function sendMessage(event) {
            event.preventDefault();
            const message = elements.input.value.trim();
            if (!message || elements.send.disabled) return;
            if (!state.apiKey) {
              elements.chatState.textContent = "Bitte zuerst oben den API-Key eingeben.";
              return;
            }

            addMessage(message, "user");
            elements.input.value = "";
            elements.input.disabled = true;
            elements.send.disabled = true;
            elements.send.textContent = "Sendet …";
            elements.chatState.textContent = "Nexus wurde gestartet …";

            try {
              let response = await requestJson("/chat", {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify({ message, session_id: state.chatSessionId }),
              });
              const jobId = response.job_id;
              if (!jobId) throw new Error("Chat-Job wurde ohne ID gestartet");

              while (response.status === "queued" || response.status === "running") {
                elements.chatState.textContent = response.status === "queued" ? "Nexus wartet …" : "Nexus arbeitet …";
                await new Promise((resolve) => setTimeout(resolve, 2000));
                response = await requestJson(`/chat/jobs/${encodeURIComponent(jobId)}`, {
                  headers: authHeaders(),
                });
              }

              if (response.status === "failed") {
                throw new Error(response.error || "Nexus-Chat ist fehlgeschlagen");
              }
              if (response.session_id) {
                state.chatSessionId = response.session_id;
                sessionStorage.setItem(CHAT_SESSION_STORAGE_KEY, response.session_id);
              }
              addMessage(response.reply || "Nexus hat keine Antwort geliefert.", "agent");
              const details = [response.action, response.status].filter(Boolean);
              if (response.experiment_id) details.push(`Experiment ${response.experiment_id}`);
              elements.chatState.textContent = details.join(" · ");
            } catch (error) {
              addMessage(error.message, "error");
              elements.chatState.textContent = "Senden fehlgeschlagen";
            } finally {
              elements.input.disabled = false;
              elements.send.disabled = false;
              elements.send.textContent = "Senden";
              elements.input.focus();
            }
          }
          '''
          s = s[:start] + fn.rstrip() + s[end:]
          p.write_text(s)

          Path('tests/test_nexus_chat_jobs.py').write_text('''import time\nimport unittest\nfrom types import SimpleNamespace\n\nfrom modules.nexus_chat_jobs import NexusChatJobService, STATUS_SUCCEEDED\n\n\nclass FakeChatService:\n    def handle(self, message, *, session_id=None):\n        return SimpleNamespace(reply="done", session_id=session_id or "s1", action="answer", experiment_id=None, status="completed")\n\n\nclass NexusChatJobServiceTests(unittest.TestCase):\n    def test_submit_returns_immediately_and_worker_completes(self):\n        service = NexusChatJobService(FakeChatService(), id_factory=lambda: "job1")\n        self.addCleanup(service.close)\n        job = service.submit("hello", session_id="s1")\n        self.assertEqual(job.id, "job1")\n        deadline = time.time() + 2\n        while time.time() < deadline:\n            current = service.get("job1")\n            if current and current.status == STATUS_SUCCEEDED:\n                break\n            time.sleep(0.01)\n        current = service.get("job1")\n        self.assertEqual(current.status, STATUS_SUCCEEDED)\n        self.assertEqual(current.result.reply, "done")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          # Replace the old API tests with async job endpoint coverage.
          p = Path('tests/test_nexus_chat_api.py')
          p.write_text('''import os\nimport unittest\nfrom types import SimpleNamespace\nfrom unittest.mock import MagicMock\n\nos.environ.setdefault("AGENT_API_KEY", "test-key")\n\nfrom fastapi.testclient import TestClient\nimport api\n\n\nclass NexusChatApiTests(unittest.TestCase):\n    def setUp(self):\n        self.service = MagicMock()\n        self.service.submit.return_value = SimpleNamespace(id="job-1", status="queued", session_id="chat-1")\n        api.app.dependency_overrides[api.get_nexus_chat_job_service] = lambda: self.service\n        self.client = TestClient(api.app)\n        self.addCleanup(api.app.dependency_overrides.clear)\n\n    def test_chat_requires_api_key(self):\n        response = self.client.post("/chat", json={"message": "Hallo Nexus"})\n        self.assertEqual(response.status_code, 401)\n\n    def test_chat_submit_returns_202_without_waiting_for_result(self):\n        response = self.client.post("/chat", headers={"x-api-key": "test-key"}, json={"message": "Hallo", "session_id": "chat-1"})\n        self.assertEqual(response.status_code, 202)\n        self.assertEqual(response.json()["job_id"], "job-1")\n        self.assertEqual(response.json()["status"], "queued")\n        self.service.submit.assert_called_once_with("Hallo", session_id="chat-1")\n\n    def test_poll_returns_completed_chat_result(self):\n        result = SimpleNamespace(reply="Nexus reply", session_id="chat-1", action="answer", experiment_id=None, status="completed")\n        self.service.get.return_value = SimpleNamespace(id="job-1", status="succeeded", session_id="chat-1", result=result, error=None)\n        response = self.client.get("/chat/jobs/job-1", headers={"x-api-key": "test-key"})\n        self.assertEqual(response.status_code, 200)\n        self.assertEqual(response.json()["reply"], "Nexus reply")\n        self.assertEqual(response.json()["session_id"], "chat-1")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          p = Path('tests/test_nexus_chat_web.py')
          s = p.read_text()
          s = s.replace("        self.assertIn('response.experiment_id', javascript)\n", "        self.assertIn('response.experiment_id', javascript)\n        self.assertIn('/chat/jobs/${encodeURIComponent(jobId)}', javascript)\n        self.assertIn('setTimeout(resolve, 2000)', javascript)\n")
          p.write_text(s)

          Path('.github/workflows/patch-chat-async.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.py models.py static/app.js modules/nexus_chat_jobs.py tests/test_nexus_chat_api.py tests/test_nexus_chat_jobs.py tests/test_nexus_chat_web.py .github/workflows/patch-chat-async.yml
          git commit -m "Make Nexus web chat asynchronous"
          git push origin HEAD:fix/issue-61-chat-async
