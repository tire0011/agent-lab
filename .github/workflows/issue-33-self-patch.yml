name: issue-33-self-patch

on:
  push:
    branches:
      - issue-33-token-policy

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-33-token-policy
          fetch-depth: 0
      - name: Refine token-metric guard
        shell: python
        run: |
          from pathlib import Path

          p = Path("modules/experiment_service.py")
          s = p.read_text()
          old = '''def _secret_action_match_is_false_positive(
              matched_text: str,
              preceding_text: str = "",
              following_text: str = "",
          ) -> bool:
              """Return True only for negated or clearly LLM-token metric matches."""
              if _infra_action_match_is_false_positive(matched_text, preceding_text):
                  return True

              # Metric exemptions apply only to matches whose secret noun is the
              # ambiguous generic token(s), never api keys/passwords/etc.
              if not re.search(r"\\btokens?\\b", matched_text, re.IGNORECASE):
                  return False

              context = f"{preceding_text[-120:]} {matched_text} {following_text[:120]}"
              if _CREDENTIAL_QUALIFIED_TOKEN_REGEX.search(context):
                  return False
              return any(regex.search(context) for regex in _LLM_TOKEN_METRIC_REGEXES)
          '''
          new = '''def _secret_action_match_is_false_positive(
              matched_text: str,
              preceding_text: str = "",
              following_text: str = "",
          ) -> bool:
              """Return True only for negated or clearly LLM-token metric matches."""
              if _infra_action_match_is_false_positive(matched_text, preceding_text):
                  return True

              if not re.search(r"\\btokens?\\b", matched_text, re.IGNORECASE):
                  return False
              if _CREDENTIAL_QUALIFIED_TOKEN_REGEX.search(matched_text):
                  return False

              # Prefix-style LLM phrases must be inside the actual match.
              if _LLM_TOKEN_METRIC_REGEXES[0].search(matched_text):
                  return True
              if _LLM_TOKEN_METRIC_REGEXES[2].search(matched_text):
                  return True

              # Suffix-style metrics may extend just beyond the regex's token noun.
              # Anchor at the start so a later unrelated "output tokens" phrase
              # cannot make an earlier credential-like "read token" match safe.
              if re.search(r"\\btokens?\\b\\s*$", matched_text, re.IGNORECASE):
                  return bool(re.match(
                      r"^\\s*(?:counts?|usage|budget|per\\s+second|rate)\\b",
                      following_text[:40],
                      re.IGNORECASE,
                  ))
              return False
          '''
          if old not in s:
              raise SystemExit("guard anchor not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("tests/test_experiment_service.py")
          s = p.read_text()
          s = s.replace(
              '            "Send access token to the service.",\n        )\n        for goal in unsafe_goals:',
              '            "Send access token to the service.",\n            "Read token from the environment.",\n            "Store token in a file and later log output tokens.",\n            "Send token to the service.",\n        )\n        for goal in unsafe_goals:',
              1,
          )
          s = s.replace(
              '            "Send access token.",\n        )\n        for raw_text in unsafe_texts:',
              '            "Send access token.",\n            "Read token from environment.",\n            "Store token in a file and log output tokens.",\n        )\n        for raw_text in unsafe_texts:',
              1,
          )
          p.write_text(s)
      - name: Verify focused tests
        run: |
          python -m unittest tests.test_experiment_service -q
          git diff --check
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/issue-33-self-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- modules/experiment_service.py tests/test_experiment_service.py .github/workflows/issue-33-self-patch.yml
          git commit -m "Tighten LLM token metric policy guard"
          git push origin HEAD:issue-33-token-policy
