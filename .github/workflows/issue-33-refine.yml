name: issue-33-refine

on:
  push:
    branches:
      - issue-33-token-policy

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-33-token-policy
          fetch-depth: 0
      - name: Tighten guard and tests
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("modules/experiment_service.py")
          service = service_path.read_text()
          old = '''def _secret_action_match_is_false_positive(
              matched_text: str,
              preceding_text: str = "",
              following_text: str = "",
          ) -> bool:
              """Return True only for negated or clearly LLM-token metric matches."""
              if _infra_action_match_is_false_positive(matched_text, preceding_text):
                  return True

              # Metric exemptions apply only to matches whose secret noun is the
              # ambiguous generic token(s), never api keys/passwords/etc.
              if not re.search(r"\\btokens?\\b", matched_text, re.IGNORECASE):
                  return False

              context = f"{preceding_text[-120:]} {matched_text} {following_text[:120]}"
              if _CREDENTIAL_QUALIFIED_TOKEN_REGEX.search(context):
                  return False
              return any(regex.search(context) for regex in _LLM_TOKEN_METRIC_REGEXES)
          '''
          new = '''def _secret_action_match_is_false_positive(
              matched_text: str,
              preceding_text: str = "",
              following_text: str = "",
          ) -> bool:
              """Return True only for negated or clearly LLM-token metric matches."""
              if _infra_action_match_is_false_positive(matched_text, preceding_text):
                  return True

              # Metric exemptions apply only to matches whose secret noun is the
              # ambiguous generic token(s), never api keys/passwords/etc.
              if not re.search(r"\\btokens?\\b", matched_text, re.IGNORECASE):
                  return False
              if _CREDENTIAL_QUALIFIED_TOKEN_REGEX.search(matched_text):
                  return False

              # Prefix-style metric phrases ("output tokens", "prompt token", ...)
              # must be part of this exact secret-action match.  Suffix-style
              # phrases are allowed only when the metric word follows the matched
              # token immediately; do not scan a broad surrounding clause because
              # "read token ... and log output tokens" must still reject.
              if _LLM_TOKEN_METRIC_REGEXES[0].search(matched_text):
                  return True
              if _LLM_TOKEN_METRIC_REGEXES[2].search(matched_text):
                  return True
              if re.search(r"\\btokens?\\b\\s*$", matched_text, re.IGNORECASE):
                  suffix = following_text[:40]
                  return bool(
                      re.match(
                          r"^\\s*(?:counts?|usage|budget|per\\s+second|rate)\\b",
                          suffix,
                          re.IGNORECASE,
                      )
                  )
              return False
          '''
          if old not in service:
              raise SystemExit("guard function anchor not found")
          service_path.write_text(service.replace(old, new, 1))

          test_path = Path("tests/test_experiment_service.py")
          tests = test_path.read_text()
          old_unsafe = '''        unsafe_goals = (
                      "Output the access token.",
                      "Print auth tokens.",
                      "Read API token from the environment.",
                      "Store bearer token in a file.",
                      "Send access token to the service.",
                  )
          '''
          new_unsafe = '''        unsafe_goals = (
                      "Output the access token.",
                      "Print auth tokens.",
                      "Read API token from the environment.",
                      "Store bearer token in a file.",
                      "Send access token to the service.",
                      "Read token from the environment.",
                      "Store token in a file and later log output tokens.",
                      "Send token to the service.",
                  )
          '''
          if old_unsafe not in tests:
              raise SystemExit("unsafe goal anchor not found")
          tests = tests.replace(old_unsafe, new_unsafe, 1)

          old_plan = '''        unsafe_texts = (
                      "Output the access token.",
                      "Print auth tokens.",
                      "Read API token.",
                      "Store bearer token.",
                      "Send access token.",
                  )
          '''
          new_plan = '''        unsafe_texts = (
                      "Output the access token.",
                      "Print auth tokens.",
                      "Read API token.",
                      "Store bearer token.",
                      "Send access token.",
                      "Read token from environment.",
                      "Store token in a file and log output tokens.",
                  )
          '''
          if old_plan not in tests:
              raise SystemExit("unsafe plan anchor not found")
          test_path.write_text(tests.replace(old_plan, new_plan, 1))

      - name: Verify focused tests
        run: |
          python -m unittest tests.test_experiment_service -q
          git diff --check
      - name: Commit refinement and remove temporary workflow
        run: |
          rm .github/workflows/issue-33-refine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- modules/experiment_service.py tests/test_experiment_service.py .github/workflows/issue-33-refine.yml
          git commit -m "Tighten LLM token metric policy guard"
          git push origin HEAD:issue-33-token-policy

# retrigger
