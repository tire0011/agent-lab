name: tests

on:
  push:
    branches:
      - 'nexus/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-api.txt

      - name: Run tests
        env:
          AGENT_API_KEY: test-key
        run: python -m unittest discover -s tests -q
