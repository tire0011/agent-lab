name: Apply issue 111 controller migration

on:
  push:
    branches:
      - fix/111-controller-tool-interface

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply migration
        run: python scripts/apply_issue_111.py
      - name: Run focused controller tests
        run: python -m unittest tests.test_issue_111_controller_protocol tests.test_task_orchestrator_command_tool tests.test_task_orchestrator -q
      - name: Commit verified migration
        run: |
          rm scripts/apply_issue_111.py .github/workflows/issue-111-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: simplify controller tool interface (#111)"
          git push
