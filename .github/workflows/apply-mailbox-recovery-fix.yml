name: Apply mailbox recovery fix

on:
  push:
    branches:
      - fix/mailbox-rejected-chain-recovery
    paths:
      - scripts/apply_mailbox_recovery_fix.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mailbox-rejected-chain-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install API dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Apply focused patch
        run: python scripts/apply_mailbox_recovery_fix.py
      - name: Run focused tests
        env:
          AGENT_API_KEY: test-key
        run: |
          python -m unittest tests.test_mailbox_poll_runner tests.test_mailbox_operation_chain -q
      - name: Run full suite
        env:
          AGENT_API_KEY: test-key
        run: python -m unittest discover -s tests -q
      - name: Commit product changes and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply_mailbox_recovery_fix.py .github/workflows/apply-mailbox-recovery-fix.yml
          git add modules/operation_chain_service.py modules/mailbox_poll_runner.py tests/test_mailbox_poll_runner.py tests/test_mailbox_operation_chain.py scripts/apply_mailbox_recovery_fix.py .github/workflows/apply-mailbox-recovery-fix.yml
          git commit -m "Fix rejected chain mailbox recovery"
          git push origin HEAD:fix/mailbox-rejected-chain-recovery
