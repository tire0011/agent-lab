name: One-shot chat diagnostics patch

on:
  push:
    branches:
      - fix/chat-command-observability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-command-observability
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/_patch_chat_command_observability.py
      - name: Remove helpers and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_patch_chat_command_observability.py .github/workflows/patch-chat-command-observability.yml
          git add modules/task_orchestrator.py modules/nexus_chat_jobs.py tests/test_task_orchestrator.py tests/test_nexus_chat_jobs.py
          git commit -m "Fix command tool normalization and chat job logging"
          git push origin HEAD:fix/chat-command-observability
