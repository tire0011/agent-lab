name: Remove remaining positive allowlists
on:
  push:
    branches: [fix/remove-all-static-allowlists]
    paths: [.github/workflows/remove-mailbox-write-allowlist.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-all-static-allowlists
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove remaining positive allowlists
        shell: python
        run: |
          from pathlib import Path
          import re

          # Mailbox commit paths: no static write-path allowlist.
          p = Path('modules/mailbox.py')
          t = p.read_text()
          t = t.replace('ALLOWED_WRITE_PATHS = {"communication/inbox", "communication/outbox", "IDEAS.md"}\n\n', '')
          old = '''    """Stage only allowed files and commit. Return True on success.\n\n    *extra_allowed_prefixes* may extend the module-level ``ALLOWED_WRITE_PATHS``\n    allowlist to accommodate the external-repo layout (where inbox/outbox sit\n    directly at the repository root rather than under ``communication/``).  Each\n    entry is matched against the top-level path component of the relative file\n    path; no shell globbing or traversal is permitted.\n    """\n    effective_allowed = ALLOWED_WRITE_PATHS | (extra_allowed_prefixes or frozenset())\n    for f in files:\n        rel = f.relative_to(repo_path)\n        parts = str(rel).split("/")\n        # Match single-component prefix (e.g. "inbox") OR two-component prefix\n        # (e.g. "communication/inbox") OR the exact relative path (e.g. "IDEAS.md").\n        # For root-level files (len(parts)==1) top2 equals top1; that is\n        # intentional — the exact-path check further below covers those.\n        top1 = parts[0]\n        top2 = "/".join(parts[:2]) if len(parts) >= 2 else top1\n        if (top1 not in effective_allowed\n                and top2 not in effective_allowed\n                and str(rel) not in effective_allowed):\n            raise PermissionError(f"Not allowed to commit: {rel}")\n        if f.exists():\n'''
          new = '''    """Stage the requested repository files and commit. Return True on success.\n\n    ``extra_allowed_prefixes`` is retained as an ignored compatibility argument.\n    Git paths are passed as argv after ``--`` and must be relative to the repo.\n    """\n    for f in files:\n        rel = f.relative_to(repo_path)\n        if f.exists():\n'''
          if old not in t:
              raise SystemExit('mailbox path gate block not found')
          t = t.replace(old, new)
          t = t.replace('# an explicit field allowlist and redaction before exposing anything in an\n# HTTP response.', '# explicit public-field selection and redaction before exposing anything in an\n# HTTP response.')
          t = t.replace('        # Compute per-instance commit allowlist from configured inbox/outbox paths\n', '        # Preserve configured inbox/outbox prefixes for backward-compatible calls.\n')
          t = t.replace('        # without weakening the global ALLOWED_WRITE_PATHS constant.\n', '        # The commit helper no longer restricts writes to those prefixes.\n')
          p.write_text(t)

          # Maintenance service: arbitrary service names and unfiltered process status.
          p = Path('modules/maintenance_service.py')
          t = p.read_text()
          t = t.replace('ALLOWED_SERVICE_NAMES = frozenset({"llama-server", "agent-api"})\n', '')
          t = t.replace('ALLOWED_PROCESS_PATTERNS = ("llama-server", "llama_server", "agent.py", "nexus", "uvicorn")\n', '')
          t = t.replace('            # First line is the header; then filter for known patterns.\n            header = lines[0] if lines else ""\n            filtered = [\n                l for l in lines[1:]\n                if any(pat in l for pat in ALLOWED_PROCESS_PATTERNS)\n            ]\n            output = "\\n".join([header] + filtered[:50])\n', '            output = "\\n".join(lines[:50])\n')
          old = '''    def _validate_service(self, service: Any) -> str:\n        s = str(service or "")\n        if s not in ALLOWED_SERVICE_NAMES:\n            raise MaintenanceOperationError(\n                f"service {s!r} is not allowed; choose from {sorted(ALLOWED_SERVICE_NAMES)}"\n            )\n        return s\n'''
          new = '''    def _validate_service(self, service: Any) -> str:\n        s = str(service or "").strip()\n        if not s:\n            raise MaintenanceOperationError("service is required")\n        return s\n'''
          if old not in t:
              raise SystemExit('maintenance service gate not found')
          p.write_text(t.replace(old, new))

          # Filesystem MCP: expose the server tools without a static tool filter and
          # use filesystem root by default rather than an application root gate.
          p = Path('modules/agent_clients.py')
          t = p.read_text()
          t = t.replace('from agents.mcp import MCPServerStdio, create_static_tool_filter\n', 'from agents.mcp import MCPServerStdio\n')
          t = t.replace('    allowed_root = os.getenv("AGENT_FS_ROOT", "/agent")\n', '')
          t = t.replace('        args = ["-y", "@modelcontextprotocol/server-filesystem", allowed_root]\n', '        args = ["-y", "@modelcontextprotocol/server-filesystem", "/"]\n')
          t = t.replace('        cache_tools_list=True,\n        tool_filter=create_static_tool_filter(\n            allowed_tool_names=["list_directory", "read_file"]\n        ),\n', '        cache_tools_list=True,\n')
          p.write_text(t)

          # Model test dispatch: supported adapters select behavior; no separate model allowlist.
          p = Path('modules/operations_executor.py')
          t = p.read_text()
          old = '''        allowed_models = {"azure_gpt4o", "llama"}\n        if model not in allowed_models:\n            raise ValueError(f"model must be one of {sorted(allowed_models)}")\n        if len(prompt) > 500:\n            raise ValueError("prompt must be <= 500 characters")\n\n        if model == "azure_gpt4o":\n            return await self._test_azure_gpt4o(prompt)\n        return await self._test_llama(prompt)\n'''
          new = '''        if len(prompt) > 500:\n            raise ValueError("prompt must be <= 500 characters")\n\n        if model == "azure_gpt4o":\n            return await self._test_azure_gpt4o(prompt)\n        if model == "llama":\n            return await self._test_llama(prompt)\n        raise ValueError(f"no model adapter is registered for {model!r}")\n'''
          if old not in t:
              raise SystemExit('model allowlist block not found')
          p.write_text(t.replace(old, new))

          # Experiment quality gate: use a small documentation deny classification rather
          # than a positive source-extension allowlist. State transitions are renamed only.
          p = Path('modules/experiment_service.py')
          t = p.read_text()
          t = t.replace('_ALLOWED_TRANSITIONS', '_STATE_TRANSITIONS')
          t = t.replace('# Allowed forward transitions.', '# Valid forward state transitions.')
          pattern = r'''# File extensions/names considered "concrete code or test files".*?def _is_code_or_test_file\(path: str\) -> bool:\n.*?    return any\(name\.endswith\(suffix\) for suffix in _CODE_OR_TEST_FILE_SUFFIXES\)\n'''
          repl = '''# Documentation-only plans are not implementations. Instead of maintaining a\n# positive list of source extensions, classify only obvious documentation files.\n_DOCUMENTATION_ONLY_SUFFIXES: tuple[str, ...] = (".md", ".rst", ".txt")\n\n\ndef _is_code_or_test_file(path: str) -> bool:\n    """Treat any concrete file that is not plain documentation as implementation material."""\n    name = Path(path).name.lower()\n    if not name or name in {"ideas.md", "readme", "readme.md"}:\n        return False\n    return not name.endswith(_DOCUMENTATION_ONLY_SUFFIXES)\n'''
          t, n = re.subn(pattern, repl, t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('source suffix allowlist block not found')
          t = t.replace('No safe allowlisted test command could be determined for this worktree', 'No safe test command could be determined for this worktree')
          t = t.replace('no safe allowlisted test command could be determined for this worktree', 'no safe test command could be determined for this worktree')
          t = t.replace('``allowed_roots``', 'legacy worker root configuration')
          t = t.replace('CodexWorker(allowed_roots=(worktree_path,))', 'CodexWorker()')
          t = t.replace('CodexWorker(allowed_roots=(scratch_dir,))', 'CodexWorker()')
          t = t.replace('allowed_roots=(repo_root,)', '')
          t = t.replace('allowed_roots=(worktree_path,)', '')
          t = t.replace('allowed_roots=(scratch_dir,)', '')
          p.write_text(t)

          # CodexWorker: remove the now-ignored compatibility root parameter entirely.
          p = Path('modules/codex_worker.py')
          t = p.read_text()
          t = t.replace('    allowed_roots:\n        Deprecated compatibility argument; no longer restricts working directories.\n', '')
          t = t.replace('        allowed_roots: tuple[str, ...] | None = None,\n', '')
          t = t.replace('        # Deprecated compatibility field; no application root allowlist is enforced.\n        self.allowed_roots = tuple(allowed_roots or ())\n', '')
          p.write_text(t)

          # Chat final-action schema is turn policy, not a positive tool gate; rename it
          # so the code no longer carries misleading allowlist terminology.
          p = Path('modules/nexus_chat_service.py')
          t = p.read_text().replace('allowed_actions', 'final_actions')
          p.write_text(t)

          # Tests: mailbox arbitrary paths should now commit successfully.
          p = Path('tests/test_mailbox_config.py')
          t = p.read_text()
          pattern = r'''    def test_commit_allowlist_rejects_arbitrary_paths\(self\):.*?\n(?=    def )'''
          repl = '''    def test_commit_helper_accepts_arbitrary_repo_paths(self):\n        """git_add_and_commit has no static write-path gate."""\n        from modules.mailbox import git_add_and_commit\n\n        arbitrary = self.mailbox_repo / "arbitrary.txt"\n        arbitrary.write_text("content")\n        result = git_add_and_commit(\n            self.mailbox_repo, [arbitrary], "test: arbitrary path", frozenset({"inbox", "outbox"})\n        )\n        self.assertTrue(result)\n        self.assertIn("arbitrary.txt", self._list_committed_files(self.mailbox_repo))\n\n'''
          t, n = re.subn(pattern, repl, t, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('mailbox allowlist test not found')
          t = t.replace('test_commit_allowlist_accepts_direct_inbox_outbox', 'test_commit_helper_accepts_direct_inbox_outbox')
          p.write_text(t)

          # Remove old Codex root constructor args in tests; behavior is covered by existing-dir checks.
          for test_path in Path('tests').glob('test_*.py'):
              tt = test_path.read_text()
              tt = re.sub(r'CodexWorker\(allowed_roots=\([^)]*\),\s*', 'CodexWorker(', tt)
              tt = re.sub(r'CodexWorker\(\s*allowed_roots=\([^)]*\),\s*', 'CodexWorker(', tt)
              test_path.write_text(tt)

      - name: Compile changed modules
        run: python -m py_compile modules/mailbox.py modules/maintenance_service.py modules/agent_clients.py modules/operations_executor.py modules/experiment_service.py modules/codex_worker.py modules/nexus_chat_service.py
      - name: Audit remaining terminology
        run: grep -RniE 'allowlist|whitelist|_ALLOWED_|ALLOWED_|allowed_roots|allowed_tool_names|allowed_models' modules || true
      - name: Install tests
        run: python -m pip install -r requirements-test.txt
      - name: Full suite
        env:
          AGENT_API_KEY: test-key
          AGENT_DB_PATH: ${{ runner.temp }}/nexus-test/agent.db
        run: python scripts/run_tests_ci.py
      - name: Commit and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules tests
          git commit -m "Remove remaining positive allowlists"
          git rm .github/workflows/remove-mailbox-write-allowlist.yml
          git commit -m "Remove temporary allowlist cleanup workflow"
          git push origin HEAD:fix/remove-all-static-allowlists
