name: Issue 190 one-shot cleanup
on:
  push:
    branches: [fix/190-remove-git-keyword-policy]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/190-remove-git-keyword-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python scripts/fix_190_policy.py
      - name: Validate syntax and patch
        run: |
          python -m py_compile modules/experiment_service/policy.py tests/test_experiment_service.py
          git diff --check
      - name: Commit cleanup
        run: |
          rm -f scripts/fix_190_policy.py .github/workflows/fix190-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove obsolete experiment git policy'
          git push origin HEAD:fix/190-remove-git-keyword-policy
